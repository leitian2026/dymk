plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourname.danmakucolor'
    compileSdk 34

    defaultConfig {
        applicationId "com.yourname.danmakucolor"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
